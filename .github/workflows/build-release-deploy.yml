name: Build-Release-Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'daily-build-*', 'uat-daily-build-*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build; must already identify the intended source commit"
        required: true
        type: string
      source_ref:
        description: "Git ref to build, normally the same snapshot tag"
        required: true
        default: main
        type: string
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.source_ref || github.ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_REF }}

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_REF }}
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true
        
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        # Build variables
        VERSION=${{ env.RELEASE_TAG }}
        if [[ -z "${{ inputs.release_tag }}" && ! "${{ github.ref }}" =~ ^refs/tags/ ]]; then
          VERSION=${{ github.sha }}
        fi
        
        # Build binary
        mkdir -p dist
        BINARY="xray-exporter-${{ matrix.goos }}-${{ matrix.goarch }}"
        [ "${{ matrix.goos }}" = "windows" ] && BINARY="${BINARY}.exe"
        
        go build -ldflags="-s -w -X main.buildCommit=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.buildVersion=${VERSION}" -o "dist/${BINARY}" .
        
        # Make binary executable
        chmod +x "dist/${BINARY}"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: xray-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/
        retention-days: 7

  docker:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_REF }}
    
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist/
        pattern: xray-exporter-linux-*
        merge-multiple: true
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push multi-arch image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist/
        pattern: xray-exporter-*
        merge-multiple: true
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: dist/*
        generate_release_notes: true 
